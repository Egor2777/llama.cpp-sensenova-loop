name: SenseNova Win CUDA build
on: workflow_dispatch

jobs:
  cpu:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
      - run: choco install ninja
      - shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" -DLLAMA_BUILD_BORINGSSL=ON -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DGGML_OPENMP=ON -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON -DLLAMA_CONNECT=ON
          cmake --build build --config Release
      - uses: actions/upload-artifact@v7
        with:
          name: win-cpu
          path: build/bin/Release/*

  cuda:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.4'
          cuda_arch: x64
      - run: choco install ninja
      - shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" -DGGML_BACKEND_DL=ON -DGGML_NATIVE=OFF -DGGML_CPU=OFF -DGGML_CUDA=ON -DLLAMA_BUILD_BORINGSSL=ON -DGGML_CUDA_CCCL_VERSION=v3.4.3
          cmake --build build --config Release --target ggml-cuda
      - shell: pwsh
        run: |
          7z a ggml-cuda.zip .\build\bin\Release\ggml-cuda.dll
          $dst='cudart'; robocopy "${{ env.CUDA_PATH }}\bin" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll | Out-Null
          7z a cudart.zip $dst\*
      - uses: actions/upload-artifact@v7
        with:
          name: win-cuda
          path: |
            ggml-cuda.zip
            cudart.zip
