name: Build Windows CUDA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: '12.8.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_CUDA=ON
          -DGGML_NATIVE=OFF
          -DCMAKE_CUDA_ARCHITECTURES="120-real"
          -DLLAMA_BUILD_TESTS=OFF
          -DLLAMA_BUILD_EXAMPLES=ON

      - name: Build llama-cli
        run: cmake --build build --target llama-cli -j 4

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item build\bin\* out\ -Recurse -Force
          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          foreach ($pat in "cudart64_*.dll","cublas64_*.dll","cublasLt64_*.dll") {
            Get-ChildItem -Path $cudaBin -Recurse -Filter $pat -ErrorAction SilentlyContinue |
              ForEach-Object { Copy-Item $_.FullName out\ -Force }
          }
          Get-ChildItem out | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: llama-sensenova-win-cuda
          path: out/*
