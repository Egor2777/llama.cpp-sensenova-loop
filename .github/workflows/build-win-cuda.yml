name: Build Windows CUDA (sm_120)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: sensenova-loop

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
- name: Install CUDA Toolkit
        shell: pwsh
        run: |
          $url = "https://developer.download.nvidia.com/compute/cuda/12.8.1/local_installers/cuda_12.8.1_572.60_windows.exe"
          $installer = "$env:RUNNER_TEMP\cuda_installer.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "-s nvcc_12.8 cudart_12.8 cublas_12.8 cublas_dev_12.8" -Wait -NoNewWindow

          $cudaRoot = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA"
          if (-not (Test-Path $cudaRoot)) {
            throw "CUDA installation failed: $cudaRoot not found"
          }
          $cudaPath = Get-ChildItem $cudaRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          echo "$cudaPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G Ninja `
            -DGGML_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES="120" `
            -DLLAMA_CURL=OFF `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build binaries
        shell: pwsh
        run: |
          cmake --build build --config Release --target llama-server llama-cli -j

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\bin\*.exe -Destination dist\ -ErrorAction SilentlyContinue
          Copy-Item build\bin\*.dll -Destination dist\ -ErrorAction SilentlyContinue
          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          Get-ChildItem $cudaBin -Include "cudart64_*.dll","cublas64_*.dll","cublasLt64_*.dll" | Copy-Item -Destination dist\ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\* -DestinationPath llama-sensenova-win-cuda120.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-sensenova-win-cuda120
          path: llama-sensenova-win-cuda120.zip
